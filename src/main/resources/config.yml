# ImagePaste 設定。/imagepaste reload で反映。
# defaults の項目は、コマンド引数 (例: /imagepaste <URL> width=6 dither=none) で一回だけ上書きできます。

defaults:
  width: 4              # 横のブロック数
  height: 0             # 縦のブロック数。0 = 縦横比から自動
  mode: fit             # fit(全体を収める) / fill(隙間なく覆い余りを切る) / stretch(引き伸ばす)
  resample: bicubic     # nearest / bilinear / bicubic
  dither: floyd         # none / floyd / ordered
  brightness: 0.0       # 明るさ -1.0 ～ 1.0
  contrast: 1.0         # コントラスト 0.0 ～ 3.0
  saturation: 1.0       # 彩度 0.0 ～ 3.0
  background: transparent   # transparent か #RRGGBB。余白と透明部分の色
  rotate: 0             # 向きの回転 0/90/180/270 (時計回り)
  flip: none            # 反転 none / h(左右) / v(上下) / both
  invisible-frame: true # 額縁を不可視にする
  glow-frame: false     # 発光額縁を使う (暗所でも明るい)
  fixed: true           # 額縁を固定する (回転・取り外し不可)
  on-blocked: abort     # 置き場所が埋まっているとき abort(全体中止) / skip(その枠だけ飛ばす)

limits:
  max-width: 16
  max-height: 16
  max-tiles: 128               # 1回の貼り付けの最大タイル(地図)数
  cooldown-seconds: 10         # 同一プレイヤーの連続実行の間隔
  pending-timeout-seconds: 120 # プレビュー中、操作がないまま待てる時間

download:
  max-bytes: 10485760          # 取得サイズ上限 (10MiB)
  max-source-pixels: 40000000  # 元画像の画素数上限
  connect-timeout-seconds: 5
  timeout-seconds: 15
  max-redirects: 3
  max-concurrent: 3            # 同時に取得できる数
  allowed-ports: [80, 443]
  allowed-hosts: []            # 空なら全公開ホスト可。指定すると完全一致またはサブドメインのみ許可

preview:
  interval-ticks: 4            # 枠の更新間隔 (tick)。小さいほど滑らかだが負荷が増える
  max-distance: 10             # 見ている面を探す距離 (ブロック)
  particle: DUST               # 粒子の種類 (DUST 以外は色指定が効きません。例: END_ROD)
  particle-size: 1.0           # DUST の大きさ
  edge-step: 0.5               # 粒子の間隔 (ブロック)。小さいほど密
  edge-color: "#55FFFF"        # 外周の色
  top-color: "#FFFF55"         # 上辺と矢印の色 (画像の上を示す)
  corner-color: "#FFFFFF"      # 四隅の色
  error-color: "#FF5555"       # 置けない場所があるときの色
  scroll-sensitivity: 1        # スクロール何ノッチで1段階変えるか
  scroll-step: 1               # 1段階で変わるブロック数
  invert-scroll: false         # true でスクロール方向を逆にする
  actionbar-enabled: true
  actionbar: "&b{cols}x{rows}&7 ({tiles}タイル) &f{where} 回転{rotate}° 反転:{flip} &8| &7{status}"

messages:
  ready: "プレビュー中: 右クリック=確定 / 左クリック=キャンセル / Shift+スクロール=拡縮 / F=回転 / Q=反転"
  look-at-block: "貼りたいブロックを見てください"
  processing: "画像を変換中です..."
  preview-look: "ブロックを見てください"
  preview-ok: "右クリックで確定"
  preview-blocked: "置けない枠があります ({n})"
  prefix: "&b[ImagePaste]&r "
  downloading: "画像を取得中です..."
  cancelled: "貼り付けを中止しました"
  expired: "時間切れで貼り付け待ちを解除しました"
  placed: "貼り付けました ({cols}x{rows}タイル, 地図{count}枚)。/imagepaste undo で取り消せます"
  skipped: "{n}枠は置けないため飛ばしました"
  blocked: "置き場所が埋まっているため中止しました (問題の枠: {n})"
  undone: "直前の貼り付けを削除しました"
  nothing-to-undo: "取り消せる貼り付けがありません"
