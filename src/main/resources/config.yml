# ImagePaste 設定。/imagepaste reload で反映。
# defaults の項目は、コマンド引数 (例: /imagepaste <URL> width=6 dither=none) で一回だけ上書きできます。

defaults:
  width: 4              # 横のブロック数
  height: 0             # 縦のブロック数。0 = 縦横比から自動
  mode: fit             # fit(全体を収める) / fill(隙間なく覆い余りを切る) / stretch(引き伸ばす)
  resample: bicubic     # nearest / bilinear / bicubic
  dither: floyd         # none / floyd / ordered
  brightness: 0.0       # 明るさ -1.0 ～ 1.0
  contrast: 1.0         # コントラスト 0.0 ～ 3.0
  saturation: 1.0       # 彩度 0.0 ～ 3.0
  background: transparent   # transparent か #RRGGBB。余白と透明部分の色
  rotate: 0             # 向きの回転 0/90/180/270 (時計回り)
  flip: none            # 反転 none / h(左右) / v(上下) / both
  invisible-frame: true # 額縁を不可視にする
  glow-frame: false     # 発光額縁を使う (暗所でも明るい)
  fixed: true           # 額縁を固定する (回転・取り外し不可)
  on-blocked: abort     # 置き場所が埋まっているとき abort(全体中止) / skip(その枠だけ飛ばす)

limits:
  # 0 以下は無制限。個別の上限は権限 imagepaste.max-tiles.<数> / imagepaste.max-size.<数> でも設定できる
  max-width: 0
  max-height: 0
  max-tiles: 0                 # 1回の貼り付けの最大タイル(地図)数。0 = 無制限 (内部の安全上限は 262144)
  cooldown-seconds: 10         # 同一プレイヤーの連続実行の間隔
  pending-timeout-seconds: 120 # プレビュー中、操作がないまま待てる時間

download:
  max-bytes: 10485760          # 取得サイズ上限 (10MiB)
  max-source-pixels: 40000000  # 元画像の画素数上限。0 以下で無制限
  connect-timeout-seconds: 5
  timeout-seconds: 15
  max-redirects: 3
  max-concurrent: 3            # 同時に取得できる数
  allowed-ports: [80, 443]
  allowed-hosts: []            # 空なら全公開ホスト可。指定すると完全一致またはサブドメインのみ許可

# 貼り付けの進め方。額縁と地図は複数tickに分けて作り、進捗をアクションバーに出す (/imagepaste cancel で中止して片付ける)
place:
  tiles-per-tick: 16           # 1tickに作るタイル数。0 で一度に全部
  load-chunks: true            # false なら読み込み済みチャンクの範囲だけに置く (未ロードの所は置けない扱い)

preview:
  interval-ticks: 4            # 枠の更新間隔 (tick)。小さいほど滑らかだが負荷が増える
  max-distance: 64             # 見ている面を探す距離 (ブロック)。届かない所でも置ける
  air-click-item: true         # 素手のとき、空中の右クリックを届かせる一時アイテム(紙)を持たせる
  particle: DUST               # 粒子の種類 (DUST 以外は色指定が効きません。例: END_ROD)
  particle-size: 1.0           # DUST の大きさ
  edge-step: 0.5               # 粒子の間隔 (ブロック)。小さいほど密
  edge-color: "#55FFFF"        # 外周の色
  top-color: "#FFFF55"         # 上辺と矢印の色 (画像の上を示す)
  corner-color: "#FFFFFF"      # 四隅の色
  error-color: "#FF5555"       # 置けない場所があるときの色
  scroll-sensitivity: 1        # スクロール何ノッチで1段階変えるか
  scroll-step: 1               # 1段階で変わるブロック数
  invert-scroll: false         # true でスクロール方向を逆にする
  actionbar-enabled: true      # 現在値をアクションバーに出す (文面は lang.yml の actionbar)
  guide:
    mode: bossbar              # 操作一覧の表示方式: bossbar / scoreboard / chat / none (文面は lang.yml の guide-lines)
    bossbar-color: BLUE        # PINK BLUE RED GREEN YELLOW PURPLE WHITE
    bossbar-overlay: PROGRESS  # PROGRESS / NOTCHED_6 / NOTCHED_10 / NOTCHED_12 / NOTCHED_20

# 設置演出 (確定した瞬間)。プレビューの枠 (preview.*) とは別の設定です。
# 貼り付け範囲の面に沿って粒子を散らし、外周から中心へ波のように収束させ、四隅でバーストします。
effects:
  place:
    enabled: true
    duration-ticks: 24         # 演出の長さ (tick。20=1秒)。外周から中心へ、この間に段階的に出る
    count-multiplier: 1.0      # 粒子数の倍率 (0 で粒子なし、2.0 で倍)
    spread: 1.0                # タイル面の上での散らばり (1.0 でタイル全面、小さいほど中心寄り)
    max-tiles: 96              # 粒子を出すタイル数の上限 (多いときは間引く)
    flash-particle: EXPLOSION_EMITTER  # 最初の閃光 (空欄で無効)
    flash-count: 1
    # 面に沿って散らす粒子 (色指定などが要らない粒子のみ)。count はタイルごと
    layers:
      - { particle: END_ROD, count: 6, speed: 0.04 }
      - { particle: FIREWORK, count: 4, speed: 0.05 }
      - { particle: GLOW, count: 3, speed: 0.02 }
      - { particle: ENCHANT, count: 8, speed: 0.6 }
      - { particle: TOTEM_OF_UNDYING, count: 2, speed: 0.15 }
    # 範囲の四隅で弾ける粒子 (最初と最後の2回)
    corner-bursts:
      - { particle: TOTEM_OF_UNDYING, count: 30, speed: 0.4 }
      - { particle: END_ROD, count: 24, speed: 0.25 }
      - { particle: FIREWORK, count: 16, speed: 0.2 }
    # 効果音。delay は開始からの tick。volume / pitch は 1.0 が標準
    sounds:
      - { sound: "minecraft:entity.firework_rocket.launch", volume: 1.0, pitch: 1.0, delay: 0 }
      - { sound: "minecraft:block.beacon.activate", volume: 0.8, pitch: 1.8, delay: 0 }
      - { sound: "minecraft:entity.item_frame.place", volume: 1.0, pitch: 1.0, delay: 0 }
      - { sound: "minecraft:entity.firework_rocket.blast", volume: 1.0, pitch: 1.0, delay: 8 }
      - { sound: "minecraft:entity.firework_rocket.twinkle", volume: 1.0, pitch: 1.0, delay: 12 }
      - { sound: "minecraft:entity.player.levelup", volume: 0.9, pitch: 1.2, delay: 23 }
  # 撤去時の演出
  remove:
    enabled: true
    particle: CLOUD
    count-per-tile: 6
    spread: 0.5
    max-tiles: 64
    sound: "minecraft:entity.item_frame.remove_item"
    volume: 1.0
    pitch: 1.0

# 貼った画像を、コマンド以外の方法で壊されたときの扱い
protection:
  enabled: true                # 額縁の破壊・回転・アイテム出し入れ・地図の取り出しを拒否する
  allow-break-permission: true # true なら imagepaste.break を持つ人だけ壊せる (壊すと on-break に従う)
  on-break: protect            # protect: 欠けた記録だけ外す / remove-all: 全体を撤去 / regenerate: 欠けた額縁を再生成

list:
  page-size: 8                 # /imagepaste list の1ページの件数

# メッセージは plugins/ImagePaste/lang.yml (MiniMessage 形式) で変更できます。
