# ImagePaste メッセージ。MiniMessage 形式です (https://docs.advntr.dev/minimessage/format.html)。
# <名前> は実行時に置き換わる値です。/imagepaste reload で反映されます。
# 項目が足りない場合は、プラグイン内蔵の既定文が使われます。

prefix: "<gradient:#7dd3fc:#a78bfa><bold>ImagePaste</bold></gradient> <dark_gray>»</dark_gray> "

# ---- 共通 ----
no-permission: "<red>権限がありません。"
players-only: "<red>プレイヤーのみ使えます。"
unknown-sub: "<red>不明なコマンドです: <white><arg></white> <gray>(画像URLは http:// か https:// で始めてください。<click:run_command:'/imagepaste help'><aqua>/ip help</aqua></click>)"
bad-option: "<red>オプションが不正です: <white><opt>"
reloaded: "<green>設定と文言を再読み込みしました。"
error: "<red>失敗: <reason>"

# ---- 貼り付け ----
downloading: "<gray>画像を取得中です..."
processing: "<gray>画像を変換中です..."
too-large: "<red>サイズが上限を超えています <gray>(最大 <maxw>x<maxh>)"
too-many-tiles: "<red>タイル数が上限 <white><max></white> を超えます。"
cooldown: "<red><sec>秒後に再実行できます。"
busy: "<red>取得中です。しばらくお待ちください。"
server-busy: "<red>取得が混み合っています。少し待ってください。"
ready: "<green>プレビューを開始しました。<gray>見ている場所に貼ります。右クリックで確定、左クリックで中止です。"
look-at-block: "<red>貼りたい場所のブロックを見てください。"
nothing-pending: "<red>プレビュー中ではありません。"
cancelled: "<yellow>貼り付けを中止しました。"
expired: "<yellow>時間切れでプレビューを終了しました。"
blocked: "<red>置き場所が埋まっているため中止しました <gray>(置けない枠: <count>)"
skipped: "<yellow><count>枠は置けないため飛ばしました。"
placing: "<gray>貼り付けを開始します (<white><total></white>枚)。中止は <white>/imagepaste cancel"
progress-fetch: "<yellow>画像を取得中…"
progress-convert: "<yellow>変換中 <white><percent>%"
progress-place: "<yellow>配置中 <white><done>/<total> <gray>(<percent>%)"
progress-eta: " <gray>残り約<sec>秒"
progress-cancel-hint: " <dark_gray>| <gray>/imagepaste cancel で中止"
progress-done: "<green>完了 <gray>(<total>枚)"
place-cancelled: "<yellow>貼り付けを中止し、置いた分を片付けました。"
placed: "<green>貼り付けました <gray>(<cols>x<rows>タイル / 地図<count>枚 / ID <white><id></white>)<newline><gray>取り消し: <click:run_command:'/imagepaste remove <id>'><hover:show_text:'<gray>クリックで削除'><aqua>[削除]</aqua></hover></click>"

# ---- プレビューの表示 ----
preview-look: "<gray>ブロックを見てください"
preview-ok: "<green>置けます"
preview-blocked: "<red>置けない枠があります (<count>)"
actionbar: "<aqua><cols>x<rows></aqua> <gray>(<tiles>タイル) <white><where> 回転<rotate>° 反転:<flip></white> <dark_gray>|</dark_gray> <status>"
where-wall: "壁"
where-floor: "床"
where-ceiling: "天井"
where-none: "-"
flip-none: "なし"
flip-h: "左右"
flip-v: "上下"
flip-both: "左右+上下"
guide-title: "<gradient:#7dd3fc:#a78bfa><bold>貼り付けプレビュー</bold></gradient>"
guide-lines:
  - "<yellow>右クリック</yellow> <gray>= 確定"
  - "<yellow>左クリック</yellow> <gray>= 中止"
  - "<yellow>Shift+スクロール</yellow> <gray>= 拡縮"
  - "<yellow>F</yellow> <gray>= 回転"
  - "<yellow>Q</yellow> <gray>= 反転"
marker-name: "<aqua>貼り付けの確定 <gray>(右クリック)"

# ---- 一覧・削除・移動 ----
list-empty: "<gray>貼り付けはありません。"
list-header: "<dark_gray>━━━━ <aqua>貼り付け一覧</aqua> <gray>(<page>/<pages>ページ・<total>件)</gray> ━━━━"
list-line: "<dark_gray>▪</dark_gray> <white><id></white> <gray><cols>x<rows> <world> (<x>, <y>, <z>) <owner>"
list-footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
btn-remove: "<red>[削除]</red>"
btn-remove-hover: "<gray>クリックでこの貼り付けを削除"
btn-tp: "<aqua>[移動]</aqua>"
btn-tp-hover: "<gray>クリックでその場所へ移動"
btn-prev: "<aqua>« 前へ</aqua>"
btn-next: "<aqua>次へ »</aqua>"
undone: "<green>直前の貼り付けを削除しました。"
nothing-to-undo: "<red>取り消せる貼り付けがありません。"
not-found: "<red>その ID の貼り付けが見つかりません。"
removed: "<green>削除しました: <white><id>"
tp-done: "<green>移動しました: <white><id>"
tp-failed: "<red>移動できません (ワールドが見つかりません)。"

# ---- 保護・破損 ----
protected: "<red>これは ImagePaste の貼り付けなので壊せません。<gray>(/imagepaste remove で削除できます)"
broken-removed: "<yellow>貼り付け <white><id></white> の額縁が壊れたため、全体を撤去しました。"
broken-regenerated: "<yellow>貼り付け <white><id></white> の欠けた額縁を再生成しました。"
broken-partial: "<yellow>貼り付け <white><id></white> の額縁が壊れました (残り <count>枠)。"
broken-gone: "<yellow>貼り付け <white><id></white> は全て失われたため記録を消しました。"

# ---- ヘルプ ----
help-header: "<dark_gray>━━━━━━ <gradient:#7dd3fc:#a78bfa><bold>ImagePaste</bold></gradient> <gray>v<version></gray> ━━━━━━"
help-hint: "<gray>コマンドをクリックすると入力欄に入ります。"
help-section-paste: "<aqua>貼り付け"
help-section-preview: "<aqua>プレビュー中の操作"
help-section-manage: "<aqua>管理"
help-footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
help-options: "<gray>オプション例: <white>width=6 mode=fill quality=high rotate=90 flip=h background=#000000"
help-controls: "<gray>右クリック=確定 / 左クリック=中止 / Shift+スクロール=拡縮 / F=回転 / Q=反転"
cmd-url: "画像を取得してプレビューを始める"
cmd-size: "プレビューの大きさを指定"
cmd-rotate: "時計回りに回転 (90度ずつ / 角度指定)"
cmd-flip: "反転 (左右 / 上下)"
cmd-confirm: "見ている場所に確定"
cmd-cancel: "プレビューを中止"
cmd-undo: "直前の貼り付けを削除"
cmd-list: "貼り付け一覧 (クリックで削除・移動)"
cmd-remove: "指定IDの貼り付けを削除"
cmd-tp: "指定IDの貼り付けへ移動"
cmd-reload: "設定と文言を再読み込み"
